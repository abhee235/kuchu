[package]
name = "kuchu-relay"
version = "0.1.0"
edition = "2021"
description = "Kuchu's hook relay: Claude Code runs it on each hook event; it hands the event to Kuchu and never holds Claude Code up."
license = "MIT"

[[bin]]
name = "kuchu-relay"
path = "src/main.rs"

[dependencies]
kuchu-wire = { path = "../wire" }
serde_json = "1"

[features]
# `kuchu-relay record`, which writes raw payloads to disk to learn what Claude Code sends: only in a relay built with
# `--features record`, never in a release.
record = []
