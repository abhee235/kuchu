# A release, built only here and only from a version tag (v0.1.0, matching the version in tauri.conf.json): Kuchu and
# its relay for Windows (x64, arm64: an installer and a zip each) and macOS (Apple silicon, Intel: an archive each),
# named as the README's Install expects, and SHA256SUMS for them all, each with provenance attested by GitHub: that
# this workflow, from this tag, built that very file (the README's install checks it where it can). It is left as a
# draft, to look over before it is published. Once Partner Center's identity is set, also the Microsoft Store's
# packages, kept with the run. Actions are pinned to a commit; the rest is the runners' own tools.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: A draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Kuchu ${TAG#v}" --notes "To install Kuchu, say to Claude Code: Install Kuchu from https://github.com/abhee235/kuchu"

  build:
    needs: draft
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: kuchu-windows-x64.zip, setup: kuchu-windows-x64-setup.exe, store: x64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: kuchu-windows-arm64.zip, setup: kuchu-windows-arm64-setup.exe, store: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: kuchu-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: kuchu-macos-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      SETUP: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version
        run: test "v$(node -p "require('./app/src-tauri/tauri.conf.json').version")" = "$TAG"

      - name: Rust for the target
        run: rustup update stable --no-self-update && rustup default stable && rustup target add "$TARGET"

      - name: The pages' packages, as locked
        working-directory: app
        run: npm ci

      - name: The relay
        run: cargo build --release --locked -p kuchu-relay --target "$TARGET"

      - name: Kuchu's installer, and Kuchu zipped with its relay (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/kuchu-relay.exe" "app/src-tauri/binaries/kuchu-relay-$TARGET.exe"
          config='{"bundle":{"externalBin":["binaries/kuchu-relay"]}}'
          (cd app && npx tauri build --bundles nsis --target "$TARGET" --config "$config" -- --locked)
          mkdir -p out/kuchu
          cp target/$TARGET/release/bundle/nsis/*-setup.exe "out/$SETUP"
          cp "target/$TARGET/release/kuchu.exe" "target/$TARGET/release/kuchu-relay.exe" LICENSE LICENSE-ASSETS.md out/kuchu/
          (cd out/kuchu && 7z a -tzip "../$ASSET" .)
          rm -rf out/kuchu

      # For Partner Center, not for the release: an unsigned package nobody else can install. Runs once the package's
      # identity from Partner Center is set as the repository's variables STORE_NAME, STORE_PUBLISHER and
      # STORE_PUBLISHER_NAME.
      - name: Kuchu for the Microsoft Store (Windows)
        if: runner.os == 'Windows' && vars.STORE_NAME != ''
        env:
          STORE_NAME: ${{ vars.STORE_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_NAME: ${{ vars.STORE_PUBLISHER_NAME }}
        run: bash app/src-tauri/windows/store/pack.sh store "$TARGET:${{ matrix.store }}"

      - name: The Store package, kept with this run
        if: runner.os == 'Windows' && vars.STORE_NAME != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-${{ matrix.store }}
          path: store/msix/*.msix

      - name: Kuchu.app, its relay inside, signed ad hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/kuchu-relay" "app/src-tauri/binaries/kuchu-relay-$TARGET"
          config='{"bundle":{"externalBin":["binaries/kuchu-relay"],"resources":{"../../LICENSE":"LICENSE","../../LICENSE-ASSETS.md":"LICENSE-ASSETS.md"},"macOS":{"signingIdentity":"-"}}}'
          (cd app && npx tauri build --bundles app --target "$TARGET" --config "$config" -- --locked)
          mkdir -p out
          tar -czf "out/$ASSET" -C "target/$TARGET/release/bundle/macos" Kuchu.app

      - name: Provenance, that this workflow built these files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*

      - name: Onto the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

  sums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: SHA256SUMS, from the files as they are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'kuchu-*' --dir out
          (cd out && sha256sum kuchu-* > SHA256SUMS && cat SHA256SUMS)

      - name: Provenance for the sums too
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/SHA256SUMS

      - name: Onto the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/SHA256SUMS --clobber
