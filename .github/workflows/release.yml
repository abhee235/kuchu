# A release, built only here and only from a version tag (v0.1.0, matching the version in tauri.conf.json): Kuchu and
# its relay for Windows (x64, arm64) and macOS (Apple silicon, Intel), one archive each, named as the README's Install
# expects, and SHA256SUMS for them all. It is left as a draft, to look over before it is published. The only action
# used is checkout, pinned to a commit; the rest is the runners' own tools.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: A draft release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Kuchu ${TAG#v}" --notes "To install Kuchu, say to Claude Code: Install Kuchu from https://github.com/abhee235/kuchu"

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: kuchu-windows-x64.zip }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: kuchu-windows-arm64.zip }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: kuchu-macos-arm64.tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: kuchu-macos-x64.tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag is the version
        run: test "v$(node -p "require('./app/src-tauri/tauri.conf.json').version")" = "$TAG"

      - name: Rust for the target
        run: rustup update stable --no-self-update && rustup default stable && rustup target add "$TARGET"

      - name: The pages' packages, as locked
        working-directory: app
        run: npm ci

      - name: The relay
        run: cargo build --release --locked -p kuchu-relay --target "$TARGET"

      - name: Kuchu, zipped with its relay (Windows)
        if: runner.os == 'Windows'
        run: |
          (cd app && npx tauri build --no-bundle --target "$TARGET" -- --locked)
          mkdir -p out/kuchu
          cp "target/$TARGET/release/kuchu.exe" "target/$TARGET/release/kuchu-relay.exe" LICENSE LICENSE-ASSETS.md out/kuchu/
          (cd out/kuchu && 7z a -tzip "../$ASSET" .)

      - name: Kuchu.app, its relay inside, signed ad hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/kuchu-relay" "app/src-tauri/binaries/kuchu-relay-$TARGET"
          config='{"bundle":{"externalBin":["binaries/kuchu-relay"],"resources":{"../../LICENSE":"LICENSE","../../LICENSE-ASSETS.md":"LICENSE-ASSETS.md"},"macOS":{"signingIdentity":"-"}}}'
          (cd app && npx tauri build --bundles app --target "$TARGET" --config "$config" -- --locked)
          mkdir -p out
          tar -czf "out/$ASSET" -C "target/$TARGET/release/bundle/macos" Kuchu.app

      - name: Onto the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "out/$ASSET" --clobber

  sums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: SHA256SUMS, from the files as they are on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern 'kuchu-*' --dir out
          (cd out && sha256sum kuchu-* > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" out/SHA256SUMS --clobber
