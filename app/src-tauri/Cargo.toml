[package]
name = "kuchu"
version = "0.1.0"
description = "Kuchu: a small desk pet for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "kuchu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
