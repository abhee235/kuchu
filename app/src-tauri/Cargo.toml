[package]
name = "kuchu"
version = "0.1.8"
description = "Kuchu: a small desk pet for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "kuchu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kuchu-wire = { path = "../../wire" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt", "process"] }
dirs = "7"

# The pet's window on every Space, full-screen apps' own included (lib.rs `join_every_space`), and kept on the screen
# as Spaces change (space.rs). Already in the build through Tauri's windows; here to reach the window and the window
# server.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSValue"] }

[target.'cfg(windows)'.dependencies]
# Asking the Microsoft Store whether a newer Kuchu is out (update.rs). Already in the build through the web view; here for the Store's API.
windows = { version = "0.62", features = ["Foundation_Collections", "Services_Store", "Win32_System_WinRT"] }
# One Kuchu per sign-in: a second start hands its arguments to the first. Windows only: on macOS the system keeps an
# app to one copy, and the plugin's socket there sits in the shared /tmp.
tauri-plugin-single-instance = "2"
# Starting at sign-in: the current user's Run key.
winreg = "0.56"
# A conversation's process and everything it starts, ended together by handle (chat.rs); Kuchu started again after
# a Store update (install.rs); the app a session runs in, and its window (host.rs).
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Recovery", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
