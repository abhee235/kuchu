[package]
name = "kuchu"
version = "0.1.1"
description = "Kuchu: a small desk pet for Claude Code"
edition = "2021"
license = "MIT"

[lib]
name = "kuchu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kuchu-wire = { path = "../../wire" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt", "process"] }
dirs = "7"

[target.'cfg(windows)'.dependencies]
# One Kuchu per sign-in: a second start hands its arguments to the first. Windows only: on macOS the system keeps an
# app to one copy, and the plugin's socket there sits in the shared /tmp.
tauri-plugin-single-instance = "2"
# Starting at sign-in: the current user's Run key.
winreg = "0.56"
# A conversation's process and everything it starts, ended together by handle (chat.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }
